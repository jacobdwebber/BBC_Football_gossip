name: Run Scraper Daily

on:
  schedule:
    - cron: '0 1 * * *'  # Runs every day at 1am UTC
  workflow_dispatch:       # Also allows you to run it manually

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python BBC_Football_gossip.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add processed_articles.json
          git commit -m "Automated data update" || echo "No changes to commit"
          git push